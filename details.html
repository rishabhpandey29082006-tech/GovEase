<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovEase | Find Government Schemes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ecfdf5, #eff6ff, #f5f3ff);
            padding: 25px 15px;
            color: #172033;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 18px 22px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #172554;
        }

        .logo span {
            color: #10b981;
        }

        .step {
            background: #ecfdf5;
            color: #047857;
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.10);
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 28px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .section h2 {
            font-size: 18px;
            color: #173b63;
            margin-bottom: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #334155;
        }

        .required {
            color: red;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            outline: none;
            font-size: 13px;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,.12);
        }

        .upload {
            border: 1px dashed #94d8bb;
            padding: 15px;
            border-radius: 12px;
            background: #f0fdf4;
        }

        .upload input {
            height: auto;
            border: none;
            padding: 0;
            background: transparent;
        }

        .file-status {
            margin-top: 7px;
            font-size: 11px;
        }

        .button {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #10b981, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin: 15px 0;
            padding: 13px;
            border-radius: 10px;
            font-size: 12px;
        }

        .error {
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .success {
            color: #065f46;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .note {
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 11px;
        }

        @media(max-width:700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 22px 17px;
            }

            .step {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">
            Gov<span>Ease</span>
        </div>

        <div class="step">
            STEP 2 OF 2
        </div>
    </div>

    <div class="card">

        <h1>Complete Your Profile</h1>

        <p class="subtitle">
            Enter your details and GovEase will find government schemes
            that may match your profile.
        </p>

        <!-- PERSONAL -->
        <div class="section">
            <h2>👤 Personal Details</h2>

            <div class="grid">

                <div class="field">
                    <label>Age <span class="required">*</span></label>
                    <input id="age" type="number" min="1" max="120"
                           placeholder="Enter your age">
                </div>

                <div class="field">
                    <label>Gender <span class="required">*</span></label>
                    <select id="gender">
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label>Occupation <span class="required">*</span></label>
                    <select id="occupation">
                        <option value="">Select occupation</option>
                        <option value="student">Student</option>
                        <option value="farmer">Farmer</option>
                        <option value="worker">Worker</option>
                        <option value="business">Business</option>
                        <option value="unemployed">Unemployed</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label>Social Category <span class="required">*</span></label>
                    <select id="category">
                        <option value="">Select category</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- LOCATION -->
        <div class="section">
            <h2>📍 Location & Income</h2>

            <div class="grid">

                <div class="field">
                    <label>State / UT <span class="required">*</span></label>
                    <select id="state">
                        <option value="">Select State / UT</option>
                        <option>Uttar Pradesh</option>
                        <option>Delhi</option>
                        <option>Maharashtra</option>
                        <option>Bihar</option>
                        <option>Madhya Pradesh</option>
                        <option>Rajasthan</option>
                        <option>Haryana</option>
                        <option>Punjab</option>
                        <option>Gujarat</option>
                        <option>West Bengal</option>
                        <option>Karnataka</option>
                        <option>Tamil Nadu</option>
                        <option>Telangana</option>
                        <option>Andhra Pradesh</option>
                        <option>Kerala</option>
                        <option>Odisha</option>
                        <option>Jharkhand</option>
                        <option>Chhattisgarh</option>
                        <option>Uttarakhand</option>
                        <option>Himachal Pradesh</option>
                        <option>Assam</option>
                        <option>Jammu and Kashmir</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label>Annual Family Income <span class="required">*</span></label>
                    <select id="income">
                        <option value="">Select income range</option>
                        <option value="below_1_lakh">Below ₹1 Lakh</option>
                        <option value="1_2_lakh">₹1–2 Lakh</option>
                        <option value="2_5_lakh">₹2–5 Lakh</option>
                        <option value="5_8_lakh">₹5–8 Lakh</option>
                        <option value="above_8_lakh">Above ₹8 Lakh</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- EDUCATION -->
        <div class="section">
            <h2>🎓 Education Details</h2>

            <div class="grid">

                <div class="field">
                    <label>Highest Education <span class="required">*</span></label>
                    <select id="education">
                        <option value="">Select education</option>
                        <option value="10th">10th</option>
                        <option value="12th">12th</option>
                        <option value="diploma">Diploma</option>
                        <option value="graduate">Graduate</option>
                        <option value="postgraduate">Postgraduate</option>
                    </select>
                </div>

                <div class="field">
                    <label>Percentage <span class="required">*</span></label>
                    <input id="percentage" type="number"
                           min="0" max="100" step="0.01"
                           placeholder="Example: 78.5">
                </div>

            </div>
        </div>

        <!-- DOCUMENTS -->
        <div class="section">
            <h2>📄 Documents</h2>

            <div class="grid">

                <div class="field full">
                    <label>Marksheet</label>

                    <div class="upload">
                        <input id="marksheet"
                               type="file"
                               accept=".jpg,.jpeg,.png,.pdf">

                        <div id="marksheetStatus"
                             class="file-status"></div>
                    </div>
                </div>

                <div class="field full">
                    <label>Aadhaar / Valid ID</label>

                    <div class="upload">
                        <input id="aadhaar"
                               type="file"
                               accept=".jpg,.jpeg,.png,.pdf">

                        <div id="aadhaarStatus"
                             class="file-status"></div>
                    </div>
                </div>

                <div class="field full">
                    <label>Student ID Card</label>

                    <div class="upload">
                        <input id="studentId"
                               type="file"
                               accept=".jpg,.jpeg,.png,.pdf">

                        <div id="studentIdStatus"
                             class="file-status"></div>
                    </div>
                </div>

            </div>
        </div>

        <div id="errorBox" class="message error"></div>
        <div id="successBox" class="message success"></div>

        <button id="submitBtn" class="button">
            Find My Government Schemes →
        </button>

        <div class="note">
            GovEase provides preliminary scheme matching information.
        </div>

    </div>
</div>


<script>

    /* =========================================
       FLASK API
    ========================================= */

    const API_BASE = "http://127.0.0.1:5000";


    /* =========================================
       ELEMENTS
    ========================================= */

    const submitBtn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");


    /* =========================================
       MESSAGE FUNCTIONS
    ========================================= */

    function showError(message) {

        errorBox.textContent = message;
        errorBox.style.display = "block";
        successBox.style.display = "none";

        errorBox.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }


    function showSuccess(message) {

        successBox.textContent = message;
        successBox.style.display = "block";
        errorBox.style.display = "none";
    }


    function clearMessages() {

        errorBox.style.display = "none";
        successBox.style.display = "none";
    }


    /* =========================================
       SAFE JSON RESPONSE
    ========================================= */

    async function getJsonResponse(response) {

        const contentType =
            response.headers.get("content-type") || "";

        const text = await response.text();

        if (!contentType.includes("application/json")) {

            console.error(
                "Server response:",
                text
            );

            throw new Error(
                "Flask API returned HTML instead of JSON. " +
                "Please check the API URL and Flask routes."
            );
        }

        try {

            return JSON.parse(text);

        } catch (error) {

            throw new Error(
                "Flask returned invalid JSON."
            );
        }
    }


    /* =========================================
       FILE STATUS
    ========================================= */

    function setupFile(inputId, statusId) {

        const input =
            document.getElementById(inputId);

        const status =
            document.getElementById(statusId);

        input.addEventListener("change", () => {

            const file = input.files[0];

            if (!file) {
                status.textContent = "";
                return;
            }

            if (file.size > 5 * 1024 * 1024) {

                input.value = "";

                status.textContent =
                    "❌ File must be below 5 MB.";

                status.style.color = "#dc2626";

                return;
            }

            status.textContent =
                "✓ " + file.name;

            status.style.color = "#059669";
        });
    }


    setupFile("marksheet", "marksheetStatus");
    setupFile("aadhaar", "aadhaarStatus");
    setupFile("studentId", "studentIdStatus");


    /* =========================================
       CHECK FLASK API
    ========================================= */

    async function checkServer() {

        const response =
            await fetch(
                API_BASE + "/api/schemes"
            );

        return await getJsonResponse(response);
    }


    /* =========================================
       MAIN SUBMIT
    ========================================= */

    submitBtn.addEventListener("click", async () => {

        clearMessages();

        const age =
            Number(document.getElementById("age").value);

        const gender =
            document.getElementById("gender").value;

        const occupation =
            document.getElementById("occupation").value;

        const category =
            document.getElementById("category").value;

        const state =
            document.getElementById("state").value;

        const income =
            document.getElementById("income").value;

        const education =
            document.getElementById("education").value;

        const percentage =
            Number(document.getElementById("percentage").value);


        /* =====================================
           VALIDATION
        ===================================== */

        if (!age || age < 1 || age > 120) {
            showError("Please enter a valid age.");
            return;
        }

        if (!gender) {
            showError("Please select gender.");
            return;
        }

        if (!occupation) {
            showError("Please select occupation.");
            return;
        }

        if (!category) {
            showError("Please select social category.");
            return;
        }

        if (!state) {
            showError("Please select State / UT.");
            return;
        }

        if (!income) {
            showError("Please select annual family income.");
            return;
        }

        if (!education) {
            showError("Please select education.");
            return;
        }

        if (
            Number.isNaN(percentage) ||
            percentage < 0 ||
            percentage > 100
        ) {
            showError("Please enter a valid percentage.");
            return;
        }


        /* =====================================
           PROFILE OBJECT
        ===================================== */

        const profile = {

            age: age,

            gender: gender,

            occupation: occupation,

            category: category,

            state: state,

            income: income,

            education: education,

            percentage: percentage,

            documents: {

                aadhaar:
                    Boolean(
                        document.getElementById("aadhaar").files[0]
                    ),

                marksheet:
                    Boolean(
                        document.getElementById("marksheet").files[0]
                    ),

                studentId:
                    Boolean(
                        document.getElementById("studentId").files[0]
                    )
            }
        };


        /* =====================================
           SEND TO FLASK
        ===================================== */

        submitBtn.disabled = true;

        submitBtn.textContent =
            "Finding Suitable Schemes...";


        try {

            const response =
                await fetch(
                    API_BASE + "/api/check-eligibility",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(profile)
                    }
                );


            const result =
                await getJsonResponse(response);


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Eligibility check failed."
                );
            }


            /* =====================================
               SAVE DATA
            ===================================== */

            localStorage.setItem(
                "goveaseProfile",
                JSON.stringify(profile)
            );


            localStorage.setItem(
                "goveaseResults",
                JSON.stringify(result)
            );


            showSuccess(
                "Schemes found successfully! Opening results..."
            );


            /* =====================================
               OPEN RESULTS
            ===================================== */

            setTimeout(() => {

                window.location.href =
                    "eligibility.html";

            }, 700);


        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Unable to connect with GovEase server."
            );

            submitBtn.disabled = false;

            submitBtn.textContent =
                "Find My Government Schemes →";
        }

    });

</script>

</body>
</html>
